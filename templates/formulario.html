<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
</head>
<body>
<div class="container">
  <h1>Formulário de Cadastro</h1>
  <p>Preencha os dados abaixo</p>
  <form action="/processar" method="POST">

    <div class="campo">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required>
    </div>

    <div class="campo">
      <label for="idade">Idade:</label>
      <input type="number" id="idade" name="idade" required>
    </div>

    <div class="campo">
      <label for="curso">Curso:</label>
      <select name="curso" id="curso">
        <option value="">Python</option>
        <option value="">Flask</option>
        <option value="">HTML/CSS</option>
      </select>
    </div>
    <button type="submit">Enviar Dados</button>

  </form>
</div>



<!-- Aréa onde o resultado vai aparecer (Prenchido pelo Flask) -->
<div class="resultado">
  <h3>Resultado do processamento</h3>
  <!-- Isso é um comentario Jinja2 (Template do Flask)
       0 {{ resultado }} será substituido pelo texto que o Python Enviar
  -->
  <p>{{ resultado }}</p>
</div>







</body>
</html>
